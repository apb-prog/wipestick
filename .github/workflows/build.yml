# Build the Debian-based wipestick ISO, boot-test it in QEMU (UEFI with
# Secure Boot enforced, and legacy BIOS), and publish it on version tags.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: >
          shellcheck -S warning src/wipestick src/wipestick-tui
          overlay/usr/local/sbin/wipestick-selftest build/*.sh tests/*.sh
          live/auto/* live/config/hooks/normal/*.chroot

  build:
    needs: lint
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install live-build
        run: apt-get update -qq && apt-get install -y -qq live-build
      - name: Build ISO
        run: ./build/build-debian.sh "$GITHUB_WORKSPACE/wipestick.iso"
      - run: sha256sum wipestick.iso > wipestick.iso.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: wipestick-iso
          path: |
            wipestick.iso
            wipestick.iso.sha256
          compression-level: 0
          retention-days: 30
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-build-log
          path: live/build.log

  selftest:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [uefi-sb, bios]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wipestick-iso
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf gdisk
      - name: Boot and self-test (${{ matrix.mode }})
        run: tests/qemu-selftest.sh wipestick.iso ${{ matrix.mode }} "$RUNNER_TEMP/st"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-${{ matrix.mode }}
          path: ${{ runner.temp }}/st/serial.log

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: selftest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wipestick-iso
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            wipestick.iso
            wipestick.iso.sha256
